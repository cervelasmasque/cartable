<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EAF6FF">
<title>Cartable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#EAF6FF;--ink:#1D2B53;--muted:#51608A;--paper:#FFFFFF;--star:#FFB400;--good:#27B36A;--bad:#F2545B;--line:rgba(29,43,83,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Baloo 2",ui-rounded,"Nunito","Segoe UI",Roboto,system-ui,sans-serif;font-size:18px;line-height:1.35;color:var(--ink);background-color:var(--sky);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
#app{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.h1{font-size:28px;font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em}
.h2{font-size:22px;font-weight:700;margin:12px 0}
.sub{color:var(--muted);font-weight:600;margin:2px 0 0}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .07s ease,box-shadow .07s ease;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.link:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn:disabled{cursor:default}
.btn.primary{background:var(--star)}
.btn.big{font-size:21px;padding:14px 22px}
.btn.wide{width:100%;margin-top:20px}
.btn.danger{background:#FFE1E2}
.btn.icon{width:52px;height:52px;padding:0;font-size:24px;border-radius:50%;flex:none}
.link{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Accueil */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.avatar{width:62px;height:62px;flex:none;display:grid;place-items:center;font-size:36px;background:var(--paper);border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink)}
.hello{flex:1;min-width:0}
.hello .h1{font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{font-weight:700;color:#D9480F}
.pill{flex:none;font-weight:800;font-size:20px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{background:var(--c);border-radius:26px;min-height:156px;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.tiles .tile:nth-child(1){transform:rotate(-2deg)}
.tiles .tile:nth-child(2){transform:rotate(1.5deg)}
.tiles .tile:nth-child(3){transform:rotate(1deg)}
.tiles .tile:nth-child(4){transform:rotate(-1.5deg)}
.tiles .tile:active{transform:translateY(4px) rotate(0)}
.te{font-size:46px;line-height:1}
.tn{font-size:23px;font-weight:800;line-height:1.05}
.ts{font-size:15px;font-weight:700;background:rgba(255,255,255,.7);border-radius:999px;padding:1px 10px}
.album{display:flex;align-items:center;gap:14px;width:100%;margin-top:28px;text-align:left;border-radius:22px}
.album b{font-size:20px}
.album small{color:var(--muted);font-weight:600;font-size:15px}
.next{font-size:36px;width:58px;height:58px;display:grid;place-items:center;border:3px dashed var(--ink);border-radius:14px;flex:none}
.ghost{filter:grayscale(1) brightness(.4);opacity:.35}
.count{margin-left:auto;font-weight:800}
.foot{display:flex;justify-content:space-between;margin-top:22px}

/* Matière */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.themes{display:flex;flex-direction:column;gap:14px}
.trow{display:flex;align-items:center;gap:14px;text-align:left;border-radius:20px;padding:12px 14px;border-left-width:14px;border-left-color:var(--c)}
.tre{font-size:32px;flex:none}
.trn{flex:1;font-size:20px;line-height:1.15}
.trn small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.trs{flex:none;font-size:20px;letter-spacing:1px}
.on{color:var(--star);-webkit-text-stroke:1.5px var(--ink)}
.off{color:#D5DDEA}

/* Exercice */
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:14px;border:2px solid var(--ink);border-radius:6px;background:var(--paper)}
.prog i.ok{background:var(--good)}
.prog i.ko{background:var(--bad)}
.prog i.cur{background:var(--star)}
.lvl{flex:none;font-weight:800;font-size:15px;background:var(--c);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:20px 18px 14px;text-align:center}
.aitag{position:absolute;top:-14px;right:14px;background:#E9E2FF;border:2px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;padding:0 10px}
.hint{margin:0 0 6px;color:var(--muted);font-weight:600;font-size:16px}
.bigemo{font-size:72px;line-height:1.1;margin:4px 0}
.q{font-size:25px;font-weight:700;margin:4px 0 12px;line-height:1.25}
.blank{display:inline-block;min-width:2.6em;border-bottom:4px solid var(--star);color:transparent}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.mini,.btn.say{font-size:15px;padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 var(--ink)}
.btn.say{background:#FFF3C4}
.btn.bigsay{font-size:22px;padding:12px 26px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.choices.col{grid-template-columns:1fr}
.choice{font-size:22px;min-height:66px;padding:10px 12px;line-height:1.15}
.choice.ok{background:var(--good);color:#fff}
.choice.ko{background:var(--bad);color:#fff}
.choice.dim{opacity:.4}
.display{margin:22px auto 14px;max-width:240px;min-height:66px;display:grid;place-items:center;font-size:36px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:18px}
.display.ok{background:var(--good);color:#fff}
.display.ko{background:var(--bad);color:#fff}
.display.pin{letter-spacing:10px;font-size:30px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.btn.k{font-size:26px;min-height:60px;padding:0}
.btn.k.go{background:var(--good);color:#fff}
.spacer.on{height:240px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:3px solid var(--ink);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .22s ease-out}
.sheet.good{background:#D5F5E3}
.sheet.bad{background:#FFE1E2}
.sheet-in{max-width:540px;margin:0 auto}
.sh1{font-size:26px;font-weight:800;margin:0}
.sh2{margin:4px 0 0;font-size:19px}
.sh3{margin:6px 0 0;color:var(--muted);font-weight:600}
.sheet .btn{width:100%;margin-top:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* Résultat */
.result{text-align:center;padding-top:30px}
.center-t{text-align:center}
.bigstars{font-size:84px;line-height:1;margin:18px 0 6px;display:flex;justify-content:center;gap:6px}
.bigstars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
.bigstars .on{-webkit-text-stroke:3px var(--ink)}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.score{font-size:22px;font-weight:700;margin:6px 0 18px}
.banner{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:0 0 14px;font-weight:700}
.banner.up{background:#E4F3FF}
.banner.gift{background:#FFF3C4}
.stk{font-size:34px;vertical-align:middle}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.row .btn{flex:1 1 160px}

/* Autocollants */
.album-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.stk-cell{aspect-ratio:1;display:grid;place-items:center;font-size:32px;border:3px dashed #9AA8C7;border-radius:16px;color:#9AA8C7;font-weight:800;background:rgba(255,255,255,.5)}
.stk-cell.got{border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.stk-cell.got:nth-child(odd){transform:rotate(-4deg)}
.stk-cell.got:nth-child(even){transform:rotate(3deg)}

/* Premier lancement */
.onboard{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.inp{font:inherit;font-size:20px;width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink)}
.inp:focus{outline:3px solid var(--star)}
.lbl{font-weight:700;margin:8px 0 0}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn.av{font-size:34px;padding:8px 0}
.btn.av.sel{background:var(--star)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Chargement */
.center{text-align:center;padding-top:80px}
.spin{font-size:70px;display:inline-block;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px) rotate(8deg)}}

/* Parents */
.psec{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin-bottom:16px}
.psec h2{font-size:20px;margin:0 0 8px}
.psec .btn{font-size:16px}
.pgroup h3{font-size:17px;margin:14px 0 6px}
.prow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-top:2px solid var(--line)}
.prow span{font-weight:600;font-size:16px}
.prow small{display:block;color:var(--muted);font-size:13px}
.prow select{font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:10px;padding:4px 6px;background:var(--paper);color:var(--ink)}
.note{font-size:15px;color:var(--muted);margin:6px 0}
.fl{display:block;font-weight:700;font-size:15px;margin:10px 0}
.fl .inp{margin-top:4px;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:10px 0}
.chk input{width:24px;height:24px;accent-color:var(--good)}
.ta{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.hist{margin:0;padding-left:20px;font-size:15px}
.err{color:var(--bad);font-weight:700}

/* Bibliothèque */
.album.shelf{margin-top:14px}
.shelf .next{border-style:solid;background:#FFF3C4}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:4px}
.btn.tab{flex:none;font-size:16px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 var(--ink)}
.btn.tab.sel{background:var(--star)}
.books{display:flex;flex-direction:column;gap:14px}
.book{display:flex;gap:14px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--ink)}
.cover{flex:none;width:64px;height:86px;border:3px solid var(--ink);border-radius:6px 14px 14px 6px;background:var(--c);display:grid;place-items:center;font-size:32px;box-shadow:inset 8px 0 0 rgba(29,43,83,.18)}
.bbody{flex:1;min-width:0}
.bbody h3{margin:0;font-size:19px;line-height:1.15}
.ba{margin:0;color:var(--muted);font-size:14px;font-weight:600}
.bp{margin:4px 0 0;font-size:15px;line-height:1.3}
.bn{margin:4px 0 0;font-size:13px;color:#B4441B;font-weight:700}
.bact{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.age{font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.chip{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.chip.sel{background:var(--good);color:#fff}
.addbook{margin-top:18px}
.addbook .row{margin-top:8px}
.addbook select{font:inherit;font-size:16px;border:3px solid var(--ink);border-radius:14px;padding:8px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:20px 10px}

/* Défi, révisions, résumé */
.today{display:grid;gap:12px;margin-bottom:20px}
.btn.daily{display:flex;align-items:center;gap:12px;text-align:left;background:var(--star);border-radius:20px}
.btn.daily.done{background:#FFE7A3}
.btn.daily.rev{background:#CFE8FF}
.de-e{font-size:34px;flex:none}
.daily b{font-size:20px}
.daily small{font-weight:600;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:6px 0 10px}
.kpis b{display:block;font-size:24px;line-height:1.1}
.kpis small{display:block;font-size:13px;color:var(--muted);font-weight:600;line-height:1.15}
.ta.words{min-height:140px;font-size:15px}
.btn.filebtn{display:inline-block;margin-top:10px}
.bookmsg{margin-bottom:14px}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
'use strict';
/* ================= Outils ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const norm=x=>String(x).trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ');
const clone=o=>JSON.parse(JSON.stringify(o));
function qcm(q,answer,distractors,extra){answer=String(answer);const d=[...new Set(distractors.map(String))].filter(x=>norm(x)!==norm(answer));return Object.assign({type:'qcm',q,answer,choices:shuffle([answer,...shuffle(d).slice(0,3)])},extra||{});}
function num(q,answer,extra){return Object.assign({type:'num',q,answer:String(answer)},extra||{});}
function near(n,spread,min,max){min=min||0;if(max==null)max=Infinity;const s=new Set();let g=0;while(s.size<3&&g++<300){const d=n+rnd(-spread,spread);if(d!==n&&d>=min&&d<=max)s.add(d);}return [...s];}
function ttsOk(){return !!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech)||('speechSynthesis' in window);}

/* ================= Maths ================= */
function genNombres(L){
  const max=[0,100,500,1000][L];const t=rnd(0,3);
  if(t===0){
    const base=rnd(10,max-10),spread=Math.max(9,Math.round(max/12));
    const all=[base,...near(base,spread,1,max-1)];const big=Math.random()<.6;
    return qcm(big?'Quel est le plus grand nombre ?':'Quel est le plus petit nombre ?',big?Math.max(...all):Math.min(...all),all);
  }
  if(t===1){
    let n=rnd(2,max-2);
    if(L>=2&&Math.random()<.5)n=rnd(1,Math.floor(max/10)-1)*10+(Math.random()<.5?9:0);
    const after=n%10===9?true:n%10===0?false:Math.random()<.5;
    return after?num(`Quel nombre vient juste après ${n} ?`,n+1):num(`Quel nombre vient juste avant ${n} ?`,n-1);
  }
  if(t===2){
    if(L===1){const n=rnd(11,99),d=Math.floor(n/10),u=n%10,ex=`${n} = ${d} dizaines et ${u} unités.`;
      return Math.random()<.5?num(`Quel est le chiffre des dizaines dans ${n} ?`,d,{explain:ex}):num(`${d} dizaines et ${u} unités, ça fait quel nombre ?`,n,{explain:ex});}
    const n=rnd(101,max-1),c=Math.floor(n/100),d=Math.floor(n/10)%10,u=n%10,ex=`${n} = ${c} centaines, ${d} dizaines et ${u} unités.`,k=rnd(0,2);
    if(k===0)return num(`${c} centaines, ${d} dizaines et ${u} unités, ça fait quel nombre ?`,n,{explain:ex});
    if(k===1)return num(`Quel est le chiffre des dizaines dans ${n} ?`,d,{explain:ex});
    return num(`Quel est le chiffre des centaines dans ${n} ?`,c,{explain:ex});
  }
  const st=pick(L===1?[2,5,10]:L===2?[10,20,50]:[25,50,100]);
  const start=st*rnd(0,Math.max(1,Math.floor(max/st)-5));
  return num(`Continue la suite : ${[0,1,2,3].map(i=>start+i*st).join(', ')}, … ?`,start+4*st,{explain:`On ajoute ${st} à chaque fois.`});
}
function genAddSub(L){
  const add=Math.random()<.5;let a,b;
  if(L===1){
    if(add){const t1=rnd(1,8),t2=rnd(0,9-t1),u1=rnd(0,8),u2=rnd(1,9-u1);a=t1*10+u1;b=t2*10+u2;}
    else{a=rnd(2,9)*10+rnd(1,9);const t=rnd(0,Math.floor(a/10)-1);let u=rnd(0,a%10);if(t===0&&u===0)u=1;b=t*10+u;}
  }else if(L===2){if(add){a=rnd(15,69);b=rnd(12,99-a);}else{a=rnd(30,99);b=rnd(11,a-6);}}
  else{if(add){a=rnd(120,750);b=rnd(25,999-a);}else{a=rnd(200,999);b=rnd(25,a-40);}}
  const r=add?a+b:a-b,op=add?'+':'−';
  return num(`${a} ${op} ${b} = ?`,r,{explain:`${a} ${op} ${b} = ${r}`});
}
function genLivrets(L){
  const a=pick(L===1?[2,5,10]:L===2?[2,3,4,5,10]:[2,3,4,5,6,7,8,9,10]),b=rnd(2,10),r=a*b;
  if(L===3&&Math.random()<.4)return num(`${a} × ? = ${r}`,b,{explain:`${a} × ${b} = ${r}`});
  return Math.random()<.5?num(`${a} × ${b} = ?`,r,{explain:`${a} × ${b} = ${r}`}):num(`${b} × ${a} = ?`,r,{explain:`${b} × ${a} = ${r}`});
}
function genMental(L){
  const F={
    double:m=>{const n=rnd(2,m);return num(`Quel est le double de ${n} ?`,2*n,{explain:`${n} + ${n} = ${2*n}`});},
    moitie:m=>{const n=2*rnd(2,m);return num(`Quelle est la moitié de ${n} ?`,n/2,{explain:`${n/2} + ${n/2} = ${n}`});},
    comp:(t,step)=>{const n=step*rnd(1,t/step-1);return num(`${n} + ? = ${t}`,t-n,{explain:`${n} + ${t-n} = ${t}`});},
    plus:(d,lo,hi)=>{const n=rnd(lo,hi),s=Math.random()<.5,r=s?n+d:n-d;return num(`${n} ${s?'+':'−'} ${d} = ?`,r,{explain:`On ${s?'ajoute':'enlève'} ${d===10?'une dizaine':'une centaine'} : ${r}.`});}
  };
  const o=L===1?[()=>F.double(10),()=>F.comp(10,1),()=>F.plus(10,20,89)]
    :L===2?[()=>F.double(50),()=>F.moitie(50),()=>F.comp(100,10),()=>F.comp(100,5),()=>F.plus(10,100,489)]
    :[()=>F.double(250),()=>F.moitie(100),()=>F.comp(100,1),()=>F.plus(100,150,850),()=>F.plus(10,300,980)];
  return pick(o)();
}
const KIDS=[['Léo','il'],['Emma','elle'],['Noah','il'],['Mia','elle'],['Lucas','il'],['Zoé','elle'],['Nathan','il'],['Lina','elle']];
function genProblemes(L){
  const [N,p]=pick(KIDS),P=cap(p);
  const R=L===1?[5,30,2,15]:L===2?[20,80,10,50]:[100,500,20,200];
  const T=[
    ()=>{const a=rnd(R[0],R[1]),b=rnd(R[2],R[3]);return num(`${N} a ${a} billes. À la récré, ${p} en gagne ${b}. Combien de billes a-t-${p} maintenant ?`,a+b,{explain:`${a} + ${b} = ${a+b}`});},

  seq.forEach(([f,t,d])=>tone(f,t,d,k==='ko'?'sine':'triangle'));}catch(e){}}

}

const LVTXT={1:'facile (début de 5P)',2:'moyen (milieu de 5P)',3:'plus difficile (fin de 5P)'};
async function aiQuestions(s,th,level,n){
  const st=S.settings,ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),20000);
  const system="Tu crées des exercices pour un enfant de 9 ans en 5P HarmoS à Genève (Plan d'études romand). Réponds uniquement avec un objet JSON valide, sans aucun texte autour.";
  const prompt=`Matière : ${s.name}\nThème : ${th.name} (${typeof th.ai==='function'?th.ai():th.ai})\nNiveau : ${LVTXT[level]}\n\nCrée ${n} questions à choix multiples, variées et amusantes.\nRègles :\n- français simple, phrases courtes, adapté à un enfant de 9 ans ;\n- une seule bonne réponse et 4 choix plausibles ;\n- uniquement des faits sûrs et vérifiables ;\n- pour l'allemand : orthographe suisse (ss, jamais ß) ;\n- une explication d'une phrase.\n\nFormat exact :\n{"questions":[{"q":"...","choices":["...","...","...","..."],"answer":"texte exact de la bonne réponse","explain":"..."}]}`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json','x-api-key':st.apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:(st.model||DEF.settings.model).trim(),max_tokens:2000,system,messages:[{role:'user',content:prompt}]})});
    if(!res.ok){let m='erreur '+res.status;try{const j=await res.json();if(j.error&&j.error.message)m+=' ('+j.error.message+')';}catch(e){}throw new Error(m);}
    const data=await res.json(),text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const j=JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1));
    return (j.questions||[]).filter(x=>x&&typeof x.q==='string'&&Array.isArray(x.choices)&&x.choices.length>=2&&x.choices.some(c=>norm(c)===norm(x.answer))).slice(0,n).map(x=>{
      const ans=String(x.choices.find(c=>norm(c)===norm(x.answer))),others=x.choices.map(String).filter(c=>norm(c)!==norm(ans)).slice(0,3);
      return {type:'qcm',q:x.q,choices:shuffle([ans,...others]),answer:ans,explain:typeof x.explain==='string'?x.explain:'',ai:true};});
  }finally{clearTimeout(to);}
}

function mkSes(o){return Object.assign({i:0,correct:0,marks:[],used:new Set(),ai:[],slots:[],cur:null,answered:false,buf:'',last:null,said:false,t0:Date.now(),level:0},o);}
function themePool(){const all=[];SUBJ.forEach(s=>s.themes.forEach(th=>{const k=s.id+'.'+th.id;if(th.id==='semaine'&&S.words.length<4)return;const r=rec(k);all.push({k,th,r,acc:r.total?r.correct/r.total:.6});}));return all;}
function startDefi(){
  const list=shuffle(dueList()).slice(0,2).map(([id,r])=>({key:r.k,q:r.q,rid:id}));
  const pool=themePool().sort((a,b)=>a.acc-b.acc).slice(0,6),seen=new Set(list.map(x=>x.q.q));let g=0;
  while(list.length<5&&g++<200){const w=pick(pool),q=w.th.gen(w.r.level);if(seen.has(q.q))continue;seen.add(q.q);list.push({key:w.k,q});}
  SES=mkSes({mode:'defi',key:'defi',list:shuffle(list),n:list.length,badge:'🎯 Défi',color:'#FFB400'});SES.cur=nextQ();nav('quiz');}
function startRevision(){
  const list=shuffle(dueList()).slice(0,10).map(([id,r])=>({key:r.k,q:r.q,rid:id}));if(!list.length){nav('home');return;}
  SES=mkSes({mode:'revision',key:'revision',list,n:list.length,badge:'🔁 Révision',color:'#9FD3FF'});SES.cur=nextQ();nav('quiz');}
async function startQuiz(key){
  const [sid,tid]=key.split('.'),s=SUBJ.find(x=>x.id===sid),th=s.themes.find(x=>x.id===tid),r=rec(key);
  const ses=mkSes({mode:'theme',key,s,th,level:r.level,n:10,badge:'Niv. '+r.level,color:s.color});
  SES=ses;const st=S.settings;
  if(st.ai&&st.apiKey&&navigator.onLine!==false){
    nav('loading');
    try{ses.ai=await aiQuestions(s,th,r.level,4);}catch(e){ses.ai=[];}
    if(SES!==ses)return;
  }
  ses.slots=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,ses.ai.length);
  ses.cur=nextQ();nav('quiz');
}
function nextQ(){const s=SES;
  if(s.list){const it=s.list[s.i];s.curKey=it.key;s.curRid=it.rid||null;return it.q;}
  s.curKey=s.key;s.curRid=null;
  if(s.slots.includes(s.i)&&s.ai.length){const q=s.ai.shift();s.used.add(q.q+'|'+q.answer);return q;}
  let q;for(let t=0;t<25;t++){q=s.th.gen(s.level);if(!s.used.has(q.q+'|'+q.answer))break;}
  s.used.add(q.q+'|'+q.answer);return q;}
function answer(val){const s=SES;if(!s||s.answered)return;const q=s.cur,ok=norm(val)===norm(q.answer);
  s.answered=true;s.last=String(val);s.lastOk=ok;s.marks.push(ok);if(ok)s.correct++;
  const rc=rec(s.curKey);rc.total++;if(ok)rc.correct++;
  if(ok){if(s.curRid)reviewHit(s.curRid);}else reviewMiss(s.curKey,q);s.msg=ok?pick(PRAISE):pick(OOPS);
  sfx(ok?'ok':'ko');if(q.sayAfter)setTimeout(()=>speak(q.sayAfter.text,q.sayAfter.lang),350);render();}
function nextStep(){const s=SES;if(!s)return;s.i++;if(s.i>=s.n){finish();return;}
  s.cur=nextQ();s.answered=false;s.buf='';s.said=false;nav('quiz');}
function finish(){const s=SES,c=s.correct,n=s.n,ratio=c/n,st=ratio>=.9?3:ratio>=.7?2:ratio>=.5?1:0;
  let bonus=0;if(s.mode==='defi'&&S.defi!==today()){S.defi=today();bonus=2;}
  const before=unlocked();S.stars+=st+bonus;const after=unlocked();
  let lv=0,level=0;
  if(s.mode==='theme'){const r=rec(s.key);r.best=Math.max(r.best,st);r.plays++;
    if(c>=8&&r.level<3){r.level++;lv=1;}else if(c<=4&&r.level>1){r.level--;lv=-1;}level=r.level;}
  bumpStreak();S.history.unshift({d:new Date().toISOString(),k:s.key,c,n,l:s.level,ms:Date.now()-s.t0});S.history=S.history.slice(0,120);save();
  RES={st,c,n,lv,level,bonus,mode:s.mode,key:s.key,sid:s.s?s.s.id:null,news:STICKERS.slice(before,after)};
  SES=null;nav('result');sfx(st===3?'fanfare':'end');if(st===3)confetti();}

async function readPhoto(inp){const file=inp.files&&inp.files[0],m=document.getElementById('p-photomsg');if(!file)return;
  const key=(document.getElementById('p-key').value||'').trim();
  if(!key){m.textContent='Ajoutez d’abord une clé API dans la section « Questions surprises ».';inp.value='';return;}
  m.textContent='Lecture de la photo…';

    const ta=document.getElementById('p-words'),cur=ta.value.trim();

  catch(e){m.textContent='Échec : '+(e.name==='AbortError'?'pas de réponse après 30 secondes':e.message);}
  inp.value='';}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85).split(',')[1]);};
  img.onerror=()=>rej(new Error('image illisible'));img.src=url;});}
async function aiWords(b64,key){const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),30000);
  try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:(S.settings.model||DEF.settings.model).trim(),max_tokens:2000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
        {type:'text',text:"Cette photo montre une page de vocabulaire d'allemand d'un élève de 5P à Genève (cahier Wort-Schatz). Liste les mots et expressions allemands avec leur traduction française (traduis-les si elle n'est pas écrite). Garde l'article der/die/das des noms. Orthographe suisse : ss, jamais ß. Réponds uniquement en JSON, sans texte autour : {\"words\":[{\"de\":\"der Hund\",\"fr\":\"le chien\"}]}"}]}]})});
    if(!res.ok){let msg='erreur '+res.status;try{const j=await res.json();if(j.error&&j.error.message)msg+=' ('+j.error.message+')';}catch(e){}throw new Error(msg);}
    const data=await res.json(),text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const j=JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1));
    return (j.words||[]).filter(w=>w&&w.de&&w.fr).map(w=>({de:String(w.de).trim().replace(/ß/g,'ss'),fr:String(w.fr).trim()}));
  }finally{clearTimeout(to);}}
function parseWords(t){const seen=new Set();return t.split('\n').map(l=>l.split('=')).filter(p=>p.length>=2&&p[0].trim()&&p.slice(1).join('=').trim())
  .map(p=>({de:p[0].trim().replace(/ß/g,'ss'),fr:p.slice(1).join('=').trim()})).filter(w=>{const k=w.de.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});}
function weekHtml(){const since=Date.now()-7*864e5,h=S.history.filter(x=>new Date(x.d).getTime()>=since);
  const n=h.reduce((t,x)=>t+x.n,0),c=h.reduce((t,x)=>t+x.c,0),mins=Math.round(h.reduce((t,x)=>t+(x.ms||0),0)/60000);
  const days=new Set(h.map(x=>dstr(new Date(x.d)))).size;
  const agg={};h.forEach(x=>{if(!findTheme(x.k))return;const a=agg[x.k]||(agg[x.k]={c:0,n:0});a.c+=x.c;a.n+=x.n;});
  const hard=Object.entries(agg).filter(([,a])=>a.n>=10&&a.c/a.n<.6).map(([k,a])=>`${esc(findTheme(k).name)} (${Math.round(100*a.c/a.n)} %)`).join(', ');
  const errs=Object.values(S.review).sort((a,b)=>b.n-a.n).slice(0,5).map(r=>`<li>${r.q.listen?'Écoute':esc(r.q.q.replace(/___/g,'…'))} → <b>${esc(r.q.answer)}</b>${r.n>1?` (raté ${r.n} fois)`:''}</li>`).join('');
  const nb=Object.keys(S.review).length,due=dueList().length,books=Object.values(S.books).filter(v=>v==='lu').length;
  return `<section class="psec"><h2>Cette semaine</h2>
  <div class="kpis"><div><b>${days}</b><small>jour${days>1?'s':''} d’exercices</small></div><div><b>${mins}</b><small>minute${mins>1?'s':''}</small></div><div><b>${n?Math.round(100*c/n)+' %':'–'}</b><small>de réussite sur ${n} question${n>1?'s':''}</small></div></div>
  <p class="note"><b>Ça coince :</b> ${hard||'rien de particulier'}</p>
  <p class="note"><b>Erreurs qui reviennent :</b></p><ul class="hist">${errs||'<li>Aucune pour le moment.</li>'}</ul>
  <p class="note">${nb} question${nb>1?'s':''} en révision, dont ${due} à revoir aujourd’hui. Livres lus validés : ${books}.</p></section>`;}
function readParent(){const g=id=>document.getElementById(id);if(!g('p-name'))return;
  const nm=g('p-name').value.trim();if(nm)S.name=nm;
  S.settings.ai=g('p-ai').checked;S.settings.apiKey=g('p-key').value.trim();S.settings.model=g('p-model').value.trim()||DEF.settings.model;
  const wt=g('p-words');if(wt)S.words=parseWords(wt.value);
  document.querySelectorAll('select[data-lv]').forEach(sel=>{rec(sel.dataset.lv).level=+sel.value;});}

/* ================= Actions ================= */
const ACT={
  go:v=>nav(v),
  subj:v=>{curSubj=v;nav('subject');},
  play:v=>{if(v==='de.semaine'&&S.words.length<4){alert('Demande à un parent d’ajouter au moins 4 mots de la semaine dans l’espace parents.');return;}curSubj=v.split('.')[0];startQuiz(v);},
  defi:()=>startDefi(),
  revision:()=>startRevision(),
  avatar:v=>{S.avatar=v;document.querySelectorAll('.av').forEach(b=>b.classList.toggle('sel',b.dataset.v===v));},
  start:()=>{const nm=document.getElementById('nm'),v=(nm.value||'').trim();
    if(!v){nm.classList.add('shake');nm.focus();setTimeout(()=>nm.classList.remove('shake'),500);return;}
    S.name=v;save();nav('home');},
  choice:v=>answer(SES.cur.choices[+v]),
  key:v=>{if(SES&&!SES.answered&&SES.buf.length<5){SES.buf+=v;updDisplay();}},
  del:()=>{if(SES&&!SES.answered){SES.buf=SES.buf.slice(0,-1);updDisplay();}},
  ok:()=>{if(SES&&SES.buf!=='')answer(SES.buf);},
  next:()=>nextStep(),
  quit:()=>{if(confirm('Arrêter les exercices ?')){const m=SES&&SES.mode;SES=null;save();nav(m==='theme'?'subject':'home');}},
  cancelLoad:()=>{SES=null;nav('subject');},
  sayQ:()=>{const q=SES&&SES.cur;if(q&&q.say)speak(q.say.text,q.say.lang);},
  readQ:()=>{if(SES)speak(SES.cur.q.replace(/___/g,'…'),'fr-FR');},
  sound:()=>{S.settings.sound=!S.settings.sound;save();render();},
  parent:()=>{gatePurpose=null;pinBuf='';gateMsg='';nav('gate');},
  pkey:v=>{if(pinBuf.length<4){pinBuf+=v;if(pinBuf.length===4)checkPin();else render();}},
  pdel:()=>{pinBuf=pinBuf.slice(0,-1);render();},
  pok:()=>checkPin(),
  psave:()=>{readParent();save();nav('home');},
  ptest:async()=>{readParent();save();const out=document.getElementById('p-test');
    if(!S.settings.apiKey){out.textContent='Ajoutez d\'abord une clé API.';return;}
    out.textContent='Test en cours…';
    try{const q=await aiQuestions(SUBJ[0],SUBJ[0].themes[2],1,1);testMsg=q.length?'Ça marche ! Exemple : '+q[0].q:'Réponse reçue, mais sans question utilisable.';}
    catch(e){testMsg='Échec : '+(e.name==='AbortError'?'pas de réponse après 20 secondes':e.message);}
    const o2=document.getElementById('p-test');if(o2)o2.textContent=testMsg;},
  pexport:async()=>{readParent();save();const d=clone(S);d.settings.apiKey='';d.pin='';const txt=JSON.stringify(d);
    const ta=document.getElementById('p-bak'),m=document.getElementById('p-bakmsg');ta.value=txt;
    try{await navigator.clipboard.writeText(txt);m.textContent='Sauvegarde copiée. Collez-la dans une note ou un message.';}
    catch(e){ta.select();m.textContent='Le texte est prêt dans la case : sélectionnez-le et copiez-le.';}},
  pimport:()=>{const ta=document.getElementById('p-bak'),m=document.getElementById('p-bakmsg');
    try{const r=JSON.parse(ta.value);if(!r||!r.v)throw new Error();const keep={apiKey:S.settings.apiKey,pin:S.pin};
      S=mergeState(r);S.settings.apiKey=keep.apiKey;S.pin=keep.pin;save();render();
      const m2=document.getElementById('p-bakmsg');if(m2)m2.textContent='Progression restaurée.';}
    catch(e){m.textContent='Ce texte n\'est pas une sauvegarde valide.';}},
  btab:v=>{bookTab=v;nav('books');},
  bstat:v=>{const [id,st]=v.split('|'),y=window.scrollY;
    if(S.books[id]===st)delete S.books[id];
    else if(st==='lu'){gatePurpose={type:'book',id};pinBuf='';gateMsg='';nav('gate');return;}
    else S.books[id]=st;
    save();render();window.scrollTo(0,y);},
  badd:()=>{const ti=document.getElementById('b-title'),t=(ti.value||'').trim();
    if(!t){ti.classList.add('shake');ti.focus();setTimeout(()=>ti.classList.remove('shake'),500);return;}
    const b={id:'c'+Date.now(),cat:document.getElementById('b-cat').value,e:'📗',t,custom:true};
    S.myBooks.push(b);S.books[b.id]='envie';save();render();},
  bdel:v=>{S.myBooks=S.myBooks.filter(b=>b.id!==v);delete S.books[v];save();render();},
  pchpin:()=>{gatePurpose=null;readParent();S.pin='';save();pinBuf='';gateMsg='';nav('gate');},
  preset:()=>{if(confirm('Effacer toute la progression (étoiles, niveaux, autocollants) ?')){S.stars=0;S.themes={};S.history=[];S.review={};S.defi='';S.bookStars={};S.streak={count:0,last:''};save();render();}}
};
function updDisplay(){const d=document.querySelector('.display');if(d)d.innerHTML=esc(SES.buf)||'&nbsp;';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b);});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='p-photo')readPhoto(e.target);});
document.addEventListener('keydown',e=>{
  if(screen!=='quiz'||!SES)return;
  if(SES.answered){if(e.key==='Enter'){e.preventDefault();nextStep();}return;}
  if(SES.cur.type==='num'){if(/^[0-9]$/.test(e.key))ACT.key(e.key);else if(e.key==='Backspace')ACT.del();else if(e.key==='Enter')ACT.ok();}
});
/* Bouton retour Android (plugin @capacitor/app) */
try{const App=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(App)App.addListener('backButton',()=>{
    if(screen==='home'||screen==='onboard')App.exitApp();
    else if(screen==='quiz')ACT.quit();
    else if(screen==='loading')ACT.cancelLoad();
    else if(screen==='result')nav(RES&&RES.mode==='theme'?'subject':'home');
    else if(screen==='gate'&&gatePurpose){gatePurpose=null;nav('books');}
    else if(screen==='parent')ACT.psave();
    else nav('home');});}catch(e){}

render();
</script>
