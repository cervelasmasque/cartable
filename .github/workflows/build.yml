on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier les fichiers
        run: |
          ls -la
          test -f package.json || { echo "::error::package.json introuvable à la racine du dépôt"; exit 1; }
          test -f www/index.html || { echo "::error::www/index.html introuvable"; exit 1; }

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Garder toujours la même signature
        run: |
          if [ -f signature/debug.keystore ]; then
            mkdir -p ~/.android
            cp signature/debug.keystore ~/.android/debug.keystore
          else
            echo "::warning::signature/debug.keystore absent : les mises à jour demanderont de désinstaller l'appli"
          fi

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cartable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
